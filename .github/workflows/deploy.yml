name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # PR ではビルドのみ行い、結果を Artifact (site-preview) として保存する（本番には反映しない）
  pull_request:
  workflow_dispatch:
  # researchmap 自動同期などで定期再ビルドが必要になったら schedule を追加する

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated（git log）のため
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 授業資料（Slidev のビルド・暗号化）を CI で行う場合は、ここで src/public/lectures/ に出力する
      - run: npm run build
      - name: Upload preview (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: .vitepress/dist
          include-hidden-files: true
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
